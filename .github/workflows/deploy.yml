name: Deploy life-os

on:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_INTERNAL_URL: http://backend:8080
        run: npm run build

  deploy:
    runs-on: self-hosted
    needs: build-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t life-os-backend:latest .

      - name: Build frontend image
        run: |
          docker build \
            -t life-os-frontend:latest \
            -f frontend/Dockerfile .

      - name: Redeploy Portainer stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: |
          STACK=$(curl -sk \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            "$PORTAINER_URL/api/stacks" \
            | jq '.[] | select(.Name=="life-os")')

          STACK_ID=$(echo "$STACK" | jq '.Id')
          ENDPOINT_ID=$(echo "$STACK" | jq '.EndpointId')

          # Deploy the compose file from the repo (see docker-compose.yml)
          REQUEST_BODY=$(jq -n --rawfile content "$GITHUB_WORKSPACE/docker-compose.yml" \
            '{pullImage: false, prune: false, stackFileContent: $content}')

          curl -sk -X PUT \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            -H "Content-Type: application/json" \
            "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -d "$REQUEST_BODY" \
            --fail-with-body